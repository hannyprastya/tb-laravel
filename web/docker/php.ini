; docker/php.ini: pengaturan PHP produksi tambahan (di atas php.ini-production)
expose_php = Off               ; tanpa header X-Powered-By (P13 C.4, temuan T-02)
memory_limit = 256M
upload_max_filesize = 8M       ; batas aplikasi 2 MB ada di validasi Laravel
post_max_size = 10M
max_execution_time = 30

; OPcache: kode PHP dikompilasi sekali lalu disimpan di memori. Kode di
; image tidak pernah berubah, jadi pemeriksaan tanggal berkas dimatikan.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
