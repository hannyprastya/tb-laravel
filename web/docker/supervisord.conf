; docker/supervisord.conf: mode satu container (JALANKAN_WORKER=1), mis. Render
; Free yang hanya memberi satu web service. Apache, queue worker, dan
; scheduler jalan berdampingan; yang mati dinyalakan lagi. Di compose dan
; Kubernetes ketiganya container terpisah (lebih baik: bisa diskalakan dan
; dipantau sendiri-sendiri).
[supervisord]
nodaemon=true
logfile=/dev/null              ; nodaemon sudah menulis log ke stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:apache]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
; worker berhenti sendiri bila koneksi DB putus; jeda 10 detik sebelum
; dinyalakan lagi supaya tidak berputar cepat selama DB mati
command=sh -c "php /var/www/html/artisan queue:work --tries=3 --sleep=3 --max-time=3600 || sleep 10"
startsecs=0
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
