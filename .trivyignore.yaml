# .trivyignore.yaml: temuan trivy config yang DITERIMA dengan sadar.
# Dipakai CI (langkah "Scan konfigurasi"). Setiap baris ditinjau ulang bila
# komponen pindah ke AWS sungguhan.
misconfigurations:
  - id: AWS-0132
    paths: ["infra/storage-file/main.tf"]
    statement: >-
      Bucket lab di Floci tanpa data pribadi; SSE-S3 bawaan cukup. KMS
      customer managed key berbayar, dipasang di rancangan target.
