# deploy/compose/nginx.conf (P13 C.2 + C.3): satu pintu untuk banyak replika
# app (load balancer) + cache halaman.
#
# ATURAN CACHE (penting untuk aplikasi dengan login):
# 1. Yang disimpan hanya jawaban GET/HEAD yang diberi aplikasi header
#    "Cache-Control: public" = halaman grup 'publik' (mis. /tamu), yang sama
#    untuk semua pengunjung. Halaman Laravel lain bertanda "no-cache,
#    private" sehingga tidak pernah disimpan.
# 2. Pengunjung yang membawa cookie sesi (tb_sesi) atau cookie "ingat saya"
#    (remember_web_*) = mungkin sudah login: cache dilewati (BYPASS) dan
#    jawabannya tidak disimpan. Tanpa aturan ini halaman milik satu
#    pengguna (nama, token CSRF, berkas) bisa tersaji ke pengguna lain.
# 3. Jawaban yang membawa Set-Cookie tidak pernah disimpan (perilaku bawaan
#    Nginx; JANGAN tambahkan proxy_ignore_headers Set-Cookie).
# Akibatnya: data di halaman publik bisa basi paling lama 60 detik (TTL).
proxy_cache_path /var/cache/nginx/web keys_zone=web:10m max_size=100m inactive=10m;

map $http_cookie $ada_sesi {          # 1 = permintaan membawa cookie sesi/login
    default 0;
    "~*(tb_sesi|remember_web_)" 1;
}

upstream app_up {
    zone app_up 64k;                  # status dibagi semua worker Nginx
    least_conn;
    server app:8080 max_fails=3 fail_timeout=10s;   # DNS "app" = semua replika
}

server {
    listen 80;
    server_tokens off;                # header Server tanpa nomor versi
    client_max_body_size 10m;         # unggah berkas (batas aplikasi 2 MB)
    add_header X-Server $upstream_addr always;          # replika yang menjawab
    add_header X-Cache-Status $upstream_cache_status always;   # HIT/MISS/BYPASS

    location / {
        proxy_pass http://app_up;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;

        proxy_cache web;
        proxy_cache_bypass $ada_sesi $http_authorization;   # aturan 2
        proxy_no_cache $ada_sesi $http_authorization;       # aturan 2
        proxy_cache_valid 200 1m;     # hanya bila aplikasi tidak memberi Cache-Control
    }
}
