# apache-proses.conf (P11 Bagian B; di modul: workers.conf): jumlah worker
# Apache prefork = ${WORKERS}. Satu worker = satu permintaan sekaligus.
# KeepAlive Off: koneksi ditutup setelah tiap jawaban, worker langsung bebas.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers        1
    MinSpareServers     1
    MaxSpareServers     ${WORKERS}
    MaxRequestWorkers   ${WORKERS}
</IfModule>
