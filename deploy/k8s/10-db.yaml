# deploy/k8s/10-db.yaml (P8 B.4): PostgreSQL 17 untuk klaster lab. Data di
# emptyDir: hilang bila Pod dihapus (cukup untuk latihan). Produksi: Neon.
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, namespace: nim-00000000 }
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      securityContext:                   # P13 C.4: proses postgres bukan root
        runAsNonRoot: true
        runAsUser: 70                    # user postgres di image alpine
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: app }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: tb-rahasia, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, app] }
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # tulis hanya ke emptyDir
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: db, namespace: nim-00000000 }
spec:
  selector: { app: db }
  ports: [{ port: 5432 }]
