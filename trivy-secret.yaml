# trivy-secret.yaml (P12 D.3): aturan tambahan selain aturan bawaan Trivy.
# Trivy otomatis membaca berkas ini dari folder kerja (akar repo).
rules:
  # Disesuaikan untuk Laravel: pemisah "=" (env), ": " (YAML), atau ","
  # (manifest k8s); nilai tidak boleh diawali [ ( $ : sehingga kode seperti
  # Password::defaults(), Route::put('password', [...]) dan :value="..." di
  # Blade tidak dianggap password.
  - id: password-di-berkas
    category: general
    title: Password ditulis langsung di berkas konfigurasi
    severity: HIGH
    keywords: [password]
    regex: (?i)password["']?\s*(=|:\s|,)\s*(value:\s*)?(?P<secret>[^\s"',{}\[\]()$:]{4,})
    secret-group-name: secret
  - id: password-di-url-db
    category: general
    title: Password di dalam connection string PostgreSQL
    severity: HIGH
    keywords: [postgres]
    regex: postgres(ql)?://[^:/\s]+:(?P<secret>[^@\s]+)@
    secret-group-name: secret
  - id: app-key-laravel
    category: general
    title: APP_KEY Laravel ditulis di berkas (harus dari env/secret)
    severity: CRITICAL
    keywords: [base64]
    regex: (?P<secret>base64:[A-Za-z0-9+/]{43}=)
    secret-group-name: secret
# Password latihan compose/kind/CI ("latihan", database lokal tanpa data
# asli) sudah diputuskan sebagai risiko yang diterima. Allow-rule hanya untuk
# kata itu, supaya CI tetap merah bila ada password BARU di berkas mana pun.
allow-rules:
  - id: password-latihan-lab
    description: password latihan compose/kind/CI, risiko diterima
    regex: latihan
